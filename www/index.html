<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0D0B">
<title>Pause That</title>
<style>
:root{
  --paper:#0E0D0B;
  --panel:#151310;
  --soft:#24211D;
  --ink:#F4EADC;
  --muted:#AAA094;
  --line:#35302A;
  --accent:#F0DFC3;
  --accent-ink:#17120A;
  --signal:#F5A524;
  --off:#3A342C;
  --radius-card:18px;
  --radius-row:12px;
  --font-display:"Space Grotesk",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  --font-label:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6}
body{min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background-image:radial-gradient(rgba(244,234,220,.7) .6px,transparent .6px);background-size:3px 3px}
h1,h2,.display{font-family:var(--font-display);font-weight:650;letter-spacing:-.03em}
.eyebrow{font-family:var(--font-label);font-size:11px;line-height:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.shutdown-entry{display:block;width:100%;margin:0 0 8px;padding:16px 16px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--panel);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.shutdown-entry strong{display:block;font-family:var(--font-display);font-size:20px;line-height:26px;font-weight:600}
.shutdown-entry span{display:block;color:var(--muted);font-size:15px}
.filters{display:flex;gap:8px;margin:8px 0 4px}
.filters button{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden}
.row{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.off{opacity:.72}
.name{display:flex;align-items:center;gap:12px;font-size:17px}
.icon{width:22px;text-align:center;color:var(--muted);font-size:16px}
.toggle{width:51px;height:31px;border-radius:999px;border:0;padding:0;background:var(--accent);position:relative;cursor:pointer;flex:none}
.toggle .thumb{width:27px;height:27px;border-radius:50%;background:#fff;position:absolute;top:2px;right:2px;transition:transform .55s ease-out}
.toggle.off{background:var(--off)}
.toggle.off .thumb{transform:translateX(-20px)}
.toggle.release{box-shadow:0 0 0 3px rgba(245,165,36,.35)}
.response{padding:0 14px 14px}
.response[hidden]{display:none}
.response p{margin:0 0 10px;color:var(--ink)}
.need{margin:0 0 8px;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button,.text-btn{border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--ink);font:inherit;font-size:15px;padding:8px 12px;cursor:pointer}
.screen{position:fixed;inset:0;z-index:5;background:var(--paper);padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.screen[hidden]{display:none}
.screen h2{margin:0;font-size:34px;line-height:40px}
.line{font-size:22px;line-height:1.45}
.back{align-self:flex-start;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:0;cursor:pointer}
.field{width:100%;min-height:96px;border:1px solid var(--line);border-radius:var(--radius-row);background:var(--panel);color:var(--ink);font:inherit;padding:12px}
.held-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ripple{position:relative;height:220px;margin:12px 0 8px}
.ripple i{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border:1px solid rgba(240,223,195,.45);border-radius:50%;animation:ripple 9s ease-out infinite}
.ripple i:nth-child(2){animation-delay:-3s}
.ripple i:nth-child(3){animation-delay:-6s}
@keyframes ripple{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.6);opacity:0}}
.sounds{display:flex;flex-wrap:wrap;gap:8px}
.sounds button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media(prefers-reduced-motion:reduce){
  .toggle .thumb{transition:none}
  .ripple i{animation:none;opacity:.35;transform:none}
  .ripple i:nth-child(1){transform:scale(.8)}
  .ripple i:nth-child(2){transform:scale(1.3)}
  .ripple i:nth-child(3){transform:scale(1.8)}
}
</style></head>
<body>
<main id="home">
  <button id="shutdownEntry" class="shutdown-entry" type="button">
    <strong>Shutdown</strong>
    <span>Everything is too loud.</span>
  </button>
  <div id="filterRow" class="filters"></div>
  <div id="pinnedSection" hidden>
    <div class="eyebrow">Pinned</div>
    <div id="pinned" class="card"></div>
  </div>
  <div id="mindSection">
    <div class="eyebrow">Mind Alerts</div>
    <div id="mind" class="card"></div>
  </div>
  <div id="boundsSection">
    <div class="eyebrow">Boundaries</div>
    <div id="bounds" class="card"></div>
  </div>
  <button id="openHeld" class="text-btn" type="button">Held thoughts</button>
</main>

<section id="wordsMe" class="screen" hidden>
  <button id="wordsMeBack" class="back" type="button">Back</button>
  <h2>Words for me</h2>
  <p id="wordsMeLine" class="line"></p>
  <button id="wordsMeAnother" class="text-btn" type="button">Another one</button>
</section>

<section id="wordsThem" class="screen" hidden>
  <button id="wordsThemBack" class="back" type="button">Back</button>
  <h2>What do you need to say?</h2>
  <div id="scriptTabs" class="filters"></div>
  <p id="scriptLine" class="line"></p>
  <p class="need">No explanation is required.</p>
  <div class="actions">
    <button id="scriptCopy" type="button">Copy these words</button>
    <button id="scriptAnother" type="button">Another one</button>
  </div>
  <p id="scriptCopied" class="need" hidden>Copied.</p>
</section>

<section id="held" class="screen" hidden>
  <button id="heldBack" class="back" type="button">Back</button>
  <h2>Hold this</h2>
  <textarea id="heldField" class="field" maxlength="280" placeholder="Set it down."></textarea>
  <button id="heldSave" class="text-btn" type="button">Save</button>
  <div id="heldList"></div>
</section>

<section id="shutdownView" class="screen" hidden>
  <div class="ripple" aria-hidden="true"><i></i><i></i><i></i></div>
  <p id="shutdownLine" class="line">You can be quiet here.</p>
  <div id="shutdownSounds" class="sounds"></div>
  <button id="shutdownContinue" class="text-btn" type="button">Continue</button>
  <button id="shutdownLeave" class="back" type="button">Leave</button>
</section>

<script>
const SWITCHES=[
  {id:'overthinking',name:'Overthinking',icon:'…',group:'mind',actions:['Words for me','Hold this'],lines:[
    'We have held enough imaginary meetings about this. Adjourned.',
    'You do not need to solve this right now.',
    'If another hour of thinking fixed it, we would be done already.',
    'This can stay unanswered.']},
  {id:'spiraling',name:'Spiraling',icon:'🌀',group:'mind',actions:['Words for me'],lines:[
    'Not every thought deserves a full production.',
    'The spiral does not get the whole damn evening.',
    'One thing is true: you can stop here.',
    'No more laps around the same fear.']},
  {id:'assuming',name:'Assuming',icon:'?',group:'mind',actions:['Words for me','Words for them'],lines:[
    'We do not have enough evidence for this courtroom.',
    'A guess in a trench coat is still a guess.',
    'You can wait for actual information.',
    'Your brain is writing dialogue for people who are not here.']},
  {id:'replaying-it',name:'Replaying It',icon:'↻',group:'mind',actions:['Words for me','Hold this'],lines:[
    'The scene does not change on the forty-third replay.',
    'We saw it. We hated it. Roll credits.',
    'You do not have to edit the past tonight.',
    'This rerun has been cancelled.']},
  {id:'self-criticism',name:'Self-Criticism',icon:'⚡',group:'mind',actions:['Words for me'],lines:[
    'You are not required to bully yourself into being better.',
    'That voice is loud, not correct.',
    'You get to be a person, not a performance review.',
    'Babe, we are not punching down at ourselves today.']},
  {id:'thinking-worst-case',name:'Thinking Worst Case',icon:'☁',group:'mind',actions:['Words for me','Hold this'],lines:[
    'Possible is not the same thing as happening.',
    'Your brain skipped the trailer and wrote the disaster ending.',
    'We are not rehearsing grief for an event that has not occurred.',
    'No need to pre-suffer.']},
  {id:'rabbit-hole',name:'Rabbit Hole',icon:'↓',group:'mind',actions:['Words for me'],lines:[
    'The internet does not have the certainty you came here for.',
    'Close the tabs, including the ones in your head.',
    'More information is not always more clarity.',
    'You have dug far enough for tonight.']},
  {id:'need-to-know',name:'Need to Know',icon:'⌕',group:'mind',actions:['Words for me','Hold this'],lines:[
    'You can survive not knowing yet.',
    'The answer is not available. You are still allowed to rest.',
    'Uncertainty is uncomfortable, not an emergency.',
    'Leave the detective board alone for now.']},
  {id:'mental-noise',name:'Mental Noise',icon:'∿',group:'mind',actions:['Words for me'],lines:[
    'Nothing needs to be organized this second.',
    'Let the radio play in another room.',
    'The noise can exist without getting a response.',
    'No minutes. No agenda. Just less.']},
  {id:'access',name:'Access',icon:'⌂',group:'bounds',actions:['Words for me','Words for them'],lines:[
    'Being reachable is not the same as being available.',
    'You are allowed to close the door without a speech.',
    'Nobody is owed immediate access to you.',
    'Unavailable is a complete status.']},
  {id:'savior-mode',name:'Savior Mode',icon:'○',group:'bounds',actions:['Words for me','Words for them'],lines:[
    'Support is not the same as rescue.',
    'You can care without taking over.',
    'Their emergency does not automatically become your assignment.',
    'Put the cape down. It needs a wash anyway.']},
  {id:'feeling-obligated',name:'Feeling Obligated',icon:'∞',group:'bounds',actions:['Words for me','Words for them'],lines:[
    'Their disappointment is not your fucking emergency.',
    'A request is not a command.',
    'You can say no without managing their reaction for them.',
    'Guilt is not proof that you did something wrong.']}
];
const SCRIPTS={
  'Say no':['I can’t do that.','No. I’m not available for this.'],
  'Buy time':['I need a little time before I answer.','I’ll come back to this later.'],
  'Set a boundary':['I can talk, but not about this right now.','I’m not able to take this on.']
};
const SOUNDS=[
  {id:'brown-noise',name:'Brown Noise',file:'audio/brown-noise.wav'},
  {id:'rain',name:'Rain',file:'audio/rain.wav'},
  {id:'ocean',name:'Ocean',file:'audio/ocean.wav'},
  {id:'quiet',name:'Quiet',file:null}
];
const PAUSED_KEY='toggle.paused.v1';
const HELD_KEY='toggle.held.v1';
const BAG_KEY='toggle.response-bag.v1';
const plugins=(window.Capacitor&&window.Capacitor.Plugins)||{};
const Preferences=plugins.Preferences;
const Haptics=plugins.Haptics;
const NativeAudio=plugins.NativeAudio;
const home=document.getElementById('home');
const mind=document.getElementById('mind');
const bounds=document.getElementById('bounds');
let paused=new Set();
let bags={};
let held=[];
let filter='all';
let activeSwitch=null;
let scriptTab='Say no';
let scriptBag={};
let heldSeq=0;
let ambientId=null;
let ambientConfigured=false;
let browserAudio=null;
let shutdownStep='threshold';

const storage={
  async read(key){
    const raw=Preferences?(await Preferences.get({key})).value:localStorage.getItem(key);
    return raw?JSON.parse(raw):null;
  },
  write(key,data){
    const value=JSON.stringify(data);
    if(Preferences)return Preferences.set({key,value});
    localStorage.setItem(key,value);
  }
};

function haptic(style){
  if(!Haptics)return;
  try{Promise.resolve(Haptics.impact({style})).catch(()=>{});}catch(err){}
}

function el(tag,cls,text){
  const node=document.createElement(tag);
  if(cls)node.className=cls;
  if(text!=null)node.textContent=text;
  return node;
}

function nextLine(id,lines){
  if(!bags[id]||!bags[id].length)bags[id]=lines.map((_,i)=>i).sort(()=>Math.random()-.5);
  const index=bags[id].shift();
  storage.write(BAG_KEY,bags);
  return lines[index];
}

function makeRow(item){
  const row=el('div','row');
  row.dataset.id=item.id;
  const name=el('div','name');
  name.append(el('span','icon',item.icon),el('span','',item.name));
  const button=el('button','toggle');
  button.type='button';
  button.append(el('span','thumb'));
  button.setAttribute('aria-label',item.name);
  const response=el('div','response');
  response.hidden=true;
  const copy=el('p');
  const need=el('p','need','What do you need?');
  const actions=el('div','actions');
  item.actions.concat(['That\'s enough']).slice(0,3).forEach(label=>{
    const action=el('button','',label);
    action.type='button';
    action.onclick=()=>follow(item,label,response);
    actions.append(action);
  });
  response.append(copy,need,actions);
  button.onclick=()=>toggleSwitch(item,row,button,response,copy);
  row.append(name,button);
  const wrap=el('div');
  wrap.append(row,response);
  return wrap;
}

function toggleSwitch(item,row,button,response,copy){
  const turningOff=!button.classList.contains('off');
  if(turningOff){
    button.classList.add('off','release');
    row.classList.add('off');
    paused.add(item.id);
    copy.textContent=nextLine(item.id,item.lines);
    response.hidden=false;
    haptic('MEDIUM');
    setTimeout(()=>button.classList.remove('release'),700);
  }else{
    button.classList.remove('off','release');
    row.classList.remove('off');
    paused.delete(item.id);
    response.hidden=true;
    haptic('LIGHT');
  }
  button.setAttribute('aria-pressed',String(!turningOff));
  storage.write(PAUSED_KEY,[...paused]);
}

function follow(item,label,response){
  if(label==='That\'s enough'){
    response.hidden=true;
    haptic('LIGHT');
    return;
  }
  activeSwitch=item;
  if(label==='Words for me')openWordsMe(item);
  else if(label==='Words for them')openWordsThem();
  else if(label==='Hold this')openHeld(false);
}

function show(screen){
  ['wordsMe','wordsThem','held','shutdownView'].forEach(id=>{
    document.getElementById(id).hidden=id!==screen;
  });
  home.hidden=!!screen;
}

function openWordsMe(item){
  document.getElementById('wordsMeLine').textContent=nextLine(item.id+':me',item.lines);
  show('wordsMe');
}
document.getElementById('wordsMeAnother').onclick=()=>{
  if(activeSwitch)document.getElementById('wordsMeLine').textContent=nextLine(activeSwitch.id+':me',activeSwitch.lines);
};
document.getElementById('wordsMeBack').onclick=()=>show(null);

function openWordsThem(){
  scriptTab='Say no';
  renderScript();
  show('wordsThem');
}
function renderScript(){
  const tabs=document.getElementById('scriptTabs');
  tabs.replaceChildren();
  Object.keys(SCRIPTS).forEach(name=>{
    const tab=el('button','',name);
    tab.type='button';
    tab.setAttribute('aria-pressed',String(name===scriptTab));
    tab.onclick=()=>{scriptTab=name;renderScript();};
    tabs.append(tab);
  });
  document.getElementById('scriptLine').textContent=nextLine('script:'+scriptTab,SCRIPTS[scriptTab]);
  document.getElementById('scriptCopied').hidden=true;
}
document.getElementById('scriptAnother').onclick=renderScript;
document.getElementById('scriptCopy').onclick=async()=>{
  const text=document.getElementById('scriptLine').textContent;
  try{if(navigator.clipboard)await navigator.clipboard.writeText(text);}catch(err){}
  document.getElementById('scriptCopied').hidden=false;
};
document.getElementById('wordsThemBack').onclick=()=>show(null);

function openHeld(listOnly){
  document.getElementById('heldField').value='';
  renderHeld();
  show('held');
}
function renderHeld(){
  const list=document.getElementById('heldList');
  list.replaceChildren();
  held.forEach(item=>{
    const row=el('div','held-item');
    row.append(el('span','',item.text));
    const remove=el('button','','Let this go');
    remove.type='button';
    remove.onclick=()=>{held=held.filter(entry=>entry.id!==item.id);storage.write(HELD_KEY,held);renderHeld();};
    row.append(remove);
    list.append(row);
  });
}
document.getElementById('heldSave').onclick=()=>{
  const text=document.getElementById('heldField').value.trim();
  if(!text)return;
  heldSeq+=1;
  held.push({id:'held-'+heldSeq,text,switchId:activeSwitch&&activeSwitch.id});
  storage.write(HELD_KEY,held);
  document.getElementById('heldField').value='';
  renderHeld();
};
document.getElementById('heldBack').onclick=()=>show(null);
document.getElementById('openHeld').onclick=()=>openHeld(true);

function renderBoard(){
  mind.replaceChildren();
  bounds.replaceChildren();
  SWITCHES.forEach(item=>{
    if(filter==='mind'&&item.group!=='mind')return;
    if(filter==='bounds'&&item.group!=='bounds')return;
    const wrap=makeRow(item);
    (item.group==='mind'?mind:bounds).append(wrap);
    if(paused.has(item.id)){
      const button=wrap.querySelector('.toggle');
      button.classList.add('off');
      wrap.querySelector('.row').classList.add('off');
    }
  });
  document.getElementById('mindSection').hidden=filter==='bounds';
  document.getElementById('boundsSection').hidden=filter==='mind';
}

function renderFilters(){
  const row=document.getElementById('filterRow');
  row.replaceChildren();
  [['all','All'],['mind','Mind Alerts'],['bounds','Boundaries']].forEach(([id,label])=>{
    const button=el('button','',label);
    button.type='button';
    button.setAttribute('aria-pressed',String(filter===id));
    button.onclick=()=>{filter=id;renderFilters();renderBoard();};
    row.append(button);
  });
}

function renderSounds(){
  const box=document.getElementById('shutdownSounds');
  box.replaceChildren();
  SOUNDS.forEach(sound=>{
    const button=el('button','',sound.name);
    button.type='button';
    button.setAttribute('aria-pressed',String(ambientId===sound.id||(sound.id==='quiet'&&!ambientId&&shutdownStep==='still')));
    button.onclick=()=>playSound(sound);
    box.append(button);
  });
}

async function playSound(sound){
  shutdownStep='still';
  document.getElementById('shutdownLine').textContent='';
  document.getElementById('shutdownContinue').hidden=true;
  await stopAmbient();
  if(sound.file){
    try{
      if(NativeAudio){
        if(!ambientConfigured){
          await NativeAudio.configure({background:true,ignoreSilent:true,focus:true,showNotification:false});
          ambientConfigured=true;
        }
        await NativeAudio.preload({assetId:sound.id,assetPath:sound.file,audioChannelNum:1,isUrl:false,volume:0.35});
        await NativeAudio.loop({assetId:sound.id});
        ambientId=sound.id;
      }else if(typeof Audio!=='undefined'){
        const audio=new Audio(sound.file);
        audio.loop=true;
        audio.volume=0.35;
        await audio.play();
        browserAudio=audio;
        ambientId=sound.id;
      }
    }catch(err){ambientId=null;}
  }else ambientId=null;
  renderSounds();
}

async function stopAmbient(){
  const current=ambientId;
  ambientId=null;
  if(NativeAudio&&current){
    try{await NativeAudio.stop({assetId:current});}catch(err){}
    try{await NativeAudio.unload({assetId:current});}catch(err){}
  }
  if(browserAudio){try{browserAudio.pause();}catch(err){}browserAudio=null;}
}

function openShutdown(){
  shutdownStep='threshold';
  document.getElementById('shutdownLine').textContent='You can be quiet here.';
  document.getElementById('shutdownContinue').hidden=false;
  document.getElementById('shutdownSounds').hidden=true;
  show('shutdownView');
}
document.getElementById('shutdownEntry').onclick=openShutdown;
document.getElementById('shutdownContinue').onclick=()=>{
  if(shutdownStep==='threshold'){
    shutdownStep='sweep';
    document.getElementById('shutdownLine').textContent='Let the noise thin out.';
    return;
  }
  shutdownStep='still';
  document.getElementById('shutdownLine').textContent='';
  document.getElementById('shutdownContinue').hidden=true;
  document.getElementById('shutdownSounds').hidden=false;
  renderSounds();
  playSound(SOUNDS[0]);
};
document.getElementById('shutdownLeave').onclick=()=>{stopAmbient();show(null);};

renderFilters();
Promise.all([storage.read(PAUSED_KEY),storage.read(HELD_KEY),storage.read(BAG_KEY)]).then(([savedPaused,savedHeld,savedBags])=>{
  paused=new Set(Array.isArray(savedPaused)?savedPaused.filter(id=>SWITCHES.some(item=>item.id===id)):[]);
  held=Array.isArray(savedHeld)?savedHeld.filter(item=>item&&typeof item.text==='string'):[];
  bags=savedBags&&typeof savedBags==='object'?savedBags:{};
  renderBoard();
});
</script></body></html>
