<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>Mel's Mind</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<style>
:root{
  color-scheme:light dark;
  --page-bg:#111111;
  --phone-bg:#000000;
  --text:#ffffff;
  --secondary:#98989f;
  --card:#1c1c1e;
  --divider:#38383a;
  --toggle-off:#636366;
  --banner-bg:rgba(44,44,46,.78);
  --banner-border:rgba(255,255,255,.18);
  --banner-highlight:rgba(255,255,255,.20);
  --banner-shadow:rgba(0,0,0,.42);
  --banner-app:#f2f2f7;
  --banner-title:#ffffff;
  --banner-message:#d1d1d6;
  --sheet-bg:rgba(44,44,46,.84);
  --sheet-cancel-bg:#2c2c2e;
  --sheet-action:#0a84ff;
  --sheet-pressed:rgba(255,255,255,.1);
  --favorite:#ffd60a;
}
body{margin:0;background:var(--page-bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;display:flex;justify-content:center;padding:30px}
.phone{width:390px;min-height:800px;background:var(--phone-bg);border-radius:45px;padding:21px;box-sizing:border-box;box-shadow:0 0 40px rgba(0,0,0,.78)}
h1{font-size:32px;line-height:1.12;margin:5px 0}.sub{color:var(--secondary);font-size:15px;margin-bottom:22px}
.section{color:var(--secondary);font-size:12px;text-transform:uppercase;letter-spacing:.02em;margin:20px 8px 7px}
.card{background:var(--card);border-radius:15px;overflow:hidden}
.row{height:57px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--divider)}
.row:last-child{border:0}.name{display:flex;align-items:center;gap:11px;font-size:16px}.icon{width:24px;text-align:center;font-size:20px;line-height:1}
.toggle{width:49px;height:29px;border-radius:18px;background:#34c759;position:relative;border:0;padding:0;cursor:pointer;transition:background-color .18s ease}.toggle.off{background:var(--toggle-off)}.knob{width:25px;height:25px;background:#fff;border-radius:50%;position:absolute;top:2px;right:2px;box-shadow:0 1px 3px rgba(0,0,0,.42);transition:transform .18s ease}.toggle.off .knob{right:2px;transform:translateX(-20px)}
.restoring .toggle,.restoring .knob{transition:none}
.controls{display:flex;align-items:center;gap:4px}
.fav{width:44px;height:44px;border:0;padding:0;background:transparent;font:inherit;font-size:21px;line-height:1;color:var(--secondary);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fav[aria-pressed="true"]{color:var(--favorite)}
.remove{height:44px;border:0;padding:0 2px;background:transparent;font:inherit;font-size:13px;font-weight:600;color:#ff453a;cursor:pointer;-webkit-tap-highlight-color:transparent}
.create{display:block;margin:22px 8px 4px;height:44px;border:0;padding:0 6px;background:transparent;color:var(--sheet-action);font:inherit;font-size:17px;font-weight:600;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shutdown-entry{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:calc(100% - 16px);margin:0 8px 8px;padding:16px;border:0;border-radius:15px;background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shutdown-entry-title{font-size:20px;font-weight:650}
.shutdown-entry-sub{font-size:15px;color:var(--secondary)}
.shutdown-view{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;padding:calc(36px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));background:#0b0c10;color:#e5e5ea}
.shutdown-view[hidden]{display:none}
.shutdown-kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8e8e93}
.shutdown-remaining{margin-top:10px;font-size:64px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.shutdown-meta{margin-top:8px;font-size:17px;color:#aeaeb2}
.shutdown-actions{display:flex;flex-direction:column;gap:10px}
.shutdown-action,.shutdown-end{height:52px;border:0;border-radius:14px;background:#1c1c1e;color:#f2f2f7;font:inherit;font-size:17px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shutdown-end{background:transparent;color:#aeaeb2}
.creator-form{max-height:min(640px,calc(100vh - 24px - env(safe-area-inset-top)));overflow:auto}
.field{display:block;padding:8px 16px 10px;border-bottom:1px solid var(--divider)}
.field-label{display:block;font-size:12px;font-weight:600;color:var(--secondary);margin-bottom:4px}
.field input,.field textarea{display:block;width:100%;box-sizing:border-box;border:0;margin:0;padding:2px 0;background:transparent;color:inherit;font:inherit;font-size:17px;resize:none}
.duration-choice{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-bottom:1px solid var(--divider);font-size:17px}
.creator-error{padding:8px 16px 0;color:#ff453a;font-size:13px;font-weight:600}
.creator-error:empty{display:none}
.creator-save{font-weight:600}
.deleter-confirm{color:#ff453a;font-weight:600}
.notice{position:fixed;z-index:20;top:18px;left:50%;width:min(340px,calc(100vw - 28px));box-sizing:border-box;display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:start;padding:13px 13px 14px;border:1px solid var(--banner-border);border-radius:19px;background:var(--banner-bg);box-shadow:inset 0 1px 0 var(--banner-highlight),0 12px 34px var(--banner-shadow);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%);opacity:0;pointer-events:none;transform:translate(-50%,-130%);transition:transform .36s cubic-bezier(.2,.9,.25,1.18),opacity .24s ease}
.notice.show{opacity:1;transform:translate(-50%,0)}
.notice-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:20px;line-height:1;background:#5856d6}
.notice-copy{min-width:0}.notice-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}.notice-app{font-size:12px;font-weight:600;color:var(--banner-app)}.notice-time{font-size:11px;color:var(--secondary)}.notice-title{font-size:14px;line-height:1.2;font-weight:600;color:var(--banner-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice-message{margin-top:4px;font-size:13px;line-height:1.3;color:var(--banner-message)}
.chooser{position:fixed;inset:0;z-index:30;visibility:hidden;transition:visibility 0s linear .3s}
.chooser.show{visibility:visible;transition-delay:0s}
.chooser-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s ease}
.chooser.show .chooser-backdrop{opacity:1}
.chooser-sheet{position:absolute;left:50%;bottom:0;width:min(400px,100%);box-sizing:border-box;padding:0 calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));transform:translate(-50%,100%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.chooser.show .chooser-sheet{transform:translate(-50%,0)}
.chooser-group{background:var(--sheet-bg);border-radius:14px;overflow:hidden;margin-bottom:8px;backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%)}
.chooser-title{padding:14px 16px;text-align:center;font-size:13px;font-weight:600;line-height:1.3;color:var(--secondary);border-bottom:1px solid var(--divider)}
.chooser-option,.chooser-cancel{display:block;width:100%;height:57px;border:0;padding:0;background:transparent;font:inherit;font-size:20px;color:var(--sheet-action);cursor:pointer;-webkit-tap-highlight-color:transparent}
.chooser-option+.chooser-option{border-top:1px solid var(--divider)}
.chooser-cancel{background:var(--sheet-cancel-bg);border-radius:14px;font-weight:600}
.chooser-option:active,.chooser-cancel:active{background-image:linear-gradient(var(--sheet-pressed),var(--sheet-pressed))}
@media(prefers-color-scheme:light){
  :root{
    --page-bg:#e5e5ea;
    --phone-bg:#f2f2f7;
    --text:#000000;
    --secondary:#6e6e73;
    --card:#ffffff;
    --divider:rgba(60,60,67,.18);
    --toggle-off:#e5e5ea;
    --banner-bg:rgba(248,248,250,.76);
    --banner-border:rgba(255,255,255,.82);
    --banner-highlight:rgba(255,255,255,.92);
    --banner-shadow:rgba(0,0,0,.18);
    --banner-app:#3c3c43;
    --banner-title:#000000;
    --banner-message:#3c3c43;
    --sheet-bg:rgba(248,248,250,.86);
    --sheet-cancel-bg:#ffffff;
    --sheet-action:#007aff;
    --sheet-pressed:rgba(0,0,0,.06);
    --favorite:#ffcc00;
  }
  .phone{box-shadow:0 0 40px rgba(0,0,0,.18)}
}
@media(max-width:520px){body{background:var(--phone-bg);padding:0}.phone{width:100%;min-height:100vh;border-radius:0;padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));box-shadow:none}.notice{top:calc(10px + env(safe-area-inset-top))}}
</style></head>
<body><div class="phone">
<h1>Mel's Mind</h1><div class="sub">Your brain. Your settings.</div>
<button id="shutdownEntry" class="shutdown-entry" type="button">
  <span class="shutdown-entry-title">Shutdown</span>
  <span class="shutdown-entry-sub">Shut it all off.</span>
</button>
<div id="notice" class="notice" role="status" aria-live="polite">
  <div id="noticeIcon" class="notice-icon">🧠</div>
  <div class="notice-copy">
    <div class="notice-meta"><span class="notice-app">Mel's Mind</span><span class="notice-time">now</span></div>
    <div id="noticeTitle" class="notice-title">Overthinking</div>
    <div id="noticeMessage" class="notice-message">You don't need to solve this right now.</div>
  </div>
</div>
<div id="quickAccess" hidden><div class="section">Quick Access</div><div class="card" id="quick"></div></div>
<div class="section">Mind Alerts</div><div class="card" id="mind"></div>
<div class="section">Boundaries</div><div class="card" id="bounds"></div>
<div id="mineSection" hidden><div class="section">My Switches</div><div class="card" id="mine"></div></div>
<button id="createSwitch" class="create" type="button">+ Create a Switch</button>
</div>
<div id="chooser" class="chooser" aria-hidden="true">
  <div id="chooserBackdrop" class="chooser-backdrop"></div>
  <div class="chooser-sheet" role="dialog" aria-modal="true" aria-labelledby="chooserTitle">
    <div class="chooser-group">
      <div id="chooserTitle" class="chooser-title">Pause for…</div>
      <div id="chooserOptions"></div>
    </div>
    <button id="chooserCancel" class="chooser-cancel" type="button">Cancel</button>
  </div>
</div>
<div id="creator" class="chooser" aria-hidden="true">
  <div id="creatorBackdrop" class="chooser-backdrop"></div>
  <form id="creatorForm" class="chooser-sheet" role="dialog" aria-modal="true" aria-labelledby="creatorTitle">
    <div class="chooser-group creator-form">
      <div id="creatorTitle" class="chooser-title">New Switch</div>
      <div id="creatorError" class="creator-error" role="alert"></div>
      <div id="creatorFields"></div>
      <button id="creatorSave" class="chooser-option creator-save" type="submit">Create</button>
    </div>
    <button id="creatorCancel" class="chooser-cancel" type="button">Cancel</button>
  </form>
</div>
<div id="deleter" class="chooser" aria-hidden="true">
  <div id="deleterBackdrop" class="chooser-backdrop"></div>
  <div id="deleterSheet" class="chooser-sheet" role="dialog" aria-modal="true" aria-labelledby="deleterTitle" tabindex="-1">
    <div class="chooser-group">
      <div id="deleterTitle" class="chooser-title">Delete this switch?</div>
      <button id="deleterConfirm" class="chooser-option deleter-confirm" type="button">Delete</button>
    </div>
    <button id="deleterCancel" class="chooser-cancel" type="button">Cancel</button>
  </div>
</div>
<div id="shutdownView" class="shutdown-view" hidden>
  <div>
    <div class="shutdown-kicker">Shutdown</div>
    <div id="shutdownRemaining" class="shutdown-remaining" role="timer" aria-live="off" aria-atomic="true">20:00</div>
    <div id="shutdownSoundName" class="shutdown-meta">Brown Noise</div>
  </div>
  <div class="shutdown-actions">
    <button id="shutdownSoundButton" class="shutdown-action" type="button">Sound</button>
    <button id="shutdownTimeButton" class="shutdown-action" type="button">Time</button>
    <button id="shutdownTransitionButton" class="shutdown-action" type="button">Transition</button>
    <button id="shutdownEnd" class="shutdown-end" type="button">End Shutdown</button>
  </div>
</div>
<div id="shutdownTimeSheet" class="chooser" aria-hidden="true">
  <div id="shutdownTimeBackdrop" class="chooser-backdrop"></div>
  <div class="chooser-sheet" role="dialog" aria-modal="true" aria-labelledby="shutdownTimeTitle">
    <div class="chooser-group">
      <div id="shutdownTimeTitle" class="chooser-title">Time</div>
      <div id="shutdownTimeOptions"></div>
    </div>
    <button id="shutdownTimeCancel" class="chooser-cancel" type="button">Cancel</button>
  </div>
</div>
<div id="shutdownSoundSheet" class="chooser" aria-hidden="true">
  <div id="shutdownSoundBackdrop" class="chooser-backdrop"></div>
  <div class="chooser-sheet" role="dialog" aria-modal="true" aria-labelledby="shutdownSoundTitle">
    <div class="chooser-group">
      <div id="shutdownSoundTitle" class="chooser-title">Sound</div>
      <div id="shutdownSoundOptions"></div>
    </div>
    <button id="shutdownSoundCancel" class="chooser-cancel" type="button">Cancel</button>
  </div>
</div>
<div id="shutdownTransitionSheet" class="chooser" aria-hidden="true">
  <div id="shutdownTransitionBackdrop" class="chooser-backdrop"></div>
  <div class="chooser-sheet" role="dialog" aria-modal="true" aria-labelledby="shutdownTransitionTitle">
    <div class="chooser-group">
      <div id="shutdownTransitionTitle" class="chooser-title">Transition</div>
      <div id="shutdownTransitionOptions"></div>
    </div>
    <button id="shutdownTransitionCancel" class="chooser-cancel" type="button">Cancel</button>
  </div>
</div>
<script>
const items=[
{id:'overthinking',icon:'🧠',name:'Overthinking',message:'You don\'t need to solve this right now.',section:'mind'},
{id:'spiraling',icon:'🌀',name:'Spiraling',message:'Pause. Take one deep breath.',section:'mind'},
{id:'assuming',icon:'💭',name:'Assuming',message:'You don\'t have all the pieces yet.',section:'mind'},
{id:'replaying-it',icon:'🔁',name:'Replaying It',message:'Let it rest.',section:'mind'},
{id:'self-criticism',icon:'🪞',name:'Self-Criticism',message:'Talk to yourself like someone you love.',section:'mind'},
{id:'thinking-worst-case',icon:'🌧️',name:'Thinking Worst Case',message:'You don\'t know the future yet.',section:'mind'},
{id:'rabbit-hole',icon:'🐇',name:'Rabbit Hole',message:'Come back to where you are.',section:'mind'},
{id:'need-to-know',icon:'🔍',name:'Need to Know',message:'Not everything needs to be solved in this moment.',section:'mind'},
{id:'mental-noise',icon:'🔕',name:'Mental Noise',message:'Where could you find some quiet right now?',section:'mind'},
{id:'access',icon:'🔐',name:'Access',message:'Access to you is not unlimited.',section:'bounds'},
{id:'savior-mode',icon:'🛟',name:'Savior Mode',message:'You can care without carrying it.',section:'bounds'},
{id:'feeling-obligated',icon:'⚖️',name:'Feeling Obligated',message:'A request is not a requirement.',section:'bounds'}
];
const notice=document.getElementById('notice');
const noticeIcon=document.getElementById('noticeIcon');
const noticeTitle=document.getElementById('noticeTitle');
const noticeMessage=document.getElementById('noticeMessage');
let noticeTimer;
const phone=document.querySelector('.phone');
const chooser=document.getElementById('chooser');
const chooserBackdrop=document.getElementById('chooserBackdrop');
const chooserTitle=document.getElementById('chooserTitle');
const chooserOptions=document.getElementById('chooserOptions');
const chooserCancel=document.getElementById('chooserCancel');
let chooserFor=null;
let chooserReturnFocus=null;
let deleteFor=null;
let deleteReturnFocus=null;
const quickAccess=document.getElementById('quickAccess');
const quickCard=document.getElementById('quick');
const mineSection=document.getElementById('mineSection');
const createSwitchButton=document.getElementById('createSwitch');
const creator=document.getElementById('creator');
const creatorForm=document.getElementById('creatorForm');
const creatorFields=document.getElementById('creatorFields');
const creatorError=document.getElementById('creatorError');
const creatorCancel=document.getElementById('creatorCancel');
const creatorBackdrop=document.getElementById('creatorBackdrop');
const deleter=document.getElementById('deleter');
const deleterSheet=document.getElementById('deleterSheet');
const deleterTitle=document.getElementById('deleterTitle');
const deleterConfirm=document.getElementById('deleterConfirm');
const deleterCancel=document.getElementById('deleterCancel');
const deleterBackdrop=document.getElementById('deleterBackdrop');

const DURATION_MINUTES=[2,5,15,30];
const MAX_NAME=40;
const MAX_MESSAGE=140;
const DEFAULT_ICON='✨';
const STORE_KEY='toggle.expirations.v1';
const FAVORITES_KEY='toggle.favorites.v1';
const CUSTOM_KEY='toggle.custom-switches.v1';
const plugins=(window.Capacitor&&window.Capacitor.Plugins)||{};
const Preferences=plugins.Preferences;
const App=plugins.App;
const Haptics=plugins.Haptics;
let expirations={};
let favorites=[];
let customs=[];
let customSeq=0;
let saving=Promise.resolve();
let ready=false;
const switches=[];
const switchesById=new Map();

const storage={
  async read(key){
    const raw=Preferences?(await Preferences.get({key})).value:localStorage.getItem(key);
    return raw?JSON.parse(raw):null;
  },
  write(key,data){
    const value=JSON.stringify(data);
    saving=saving
      .then(()=>Preferences?Preferences.set({key,value}):localStorage.setItem(key,value))
      .catch(()=>{});
    return saving;
  }
};

const store={
  async load(){
    try{
      const parsed=await storage.read(STORE_KEY);
      return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};
    }catch(err){
      return {};
    }
  },
  save(){
    return storage.write(STORE_KEY,expirations);
  }
};

const favoriteStore={
  async load(){
    try{
      const parsed=await storage.read(FAVORITES_KEY);
      if(!Array.isArray(parsed))return [];
      return parsed.filter((id,n)=>typeof id==='string'&&switchesById.has(id)&&parsed.indexOf(id)===n);
    }catch(err){
      return [];
    }
  },
  save(){
    return storage.write(FAVORITES_KEY,favorites);
  }
};

function oneEmoji(text){
  const trimmed=String(text||'').trim();
  if(!trimmed)return DEFAULT_ICON;
  try{
    if(typeof Intl!=='undefined'&&Intl.Segmenter){
      const first=[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(trimmed)][0];
      if(first)return first.segment;
    }
  }catch(err){}
  return [...trimmed][0]||DEFAULT_ICON;
}

function validCustom(rec,seen){
  if(!rec||typeof rec!=='object'||Array.isArray(rec))return null;
  if(typeof rec.id!=='string'||!/^custom-[A-Za-z0-9-]{8,}$/.test(rec.id))return null;
  if(seen.has(rec.id)||switchesById.has(rec.id))return null;
  if(typeof rec.name!=='string'||typeof rec.message!=='string')return null;
  const name=rec.name.trim();
  const message=rec.message.trim();
  if(!name||name.length>MAX_NAME||!message||message.length>MAX_MESSAGE)return null;
  if(!DURATION_MINUTES.includes(rec.defaultDurationMinutes))return null;
  seen.add(rec.id);
  return {id:rec.id,name,message,icon:oneEmoji(rec.icon),defaultDurationMinutes:rec.defaultDurationMinutes};
}

const customStore={
  async load(){
    try{
      const parsed=await storage.read(CUSTOM_KEY);
      if(!Array.isArray(parsed))return [];
      const seen=new Set();
      return parsed.map(rec=>validCustom(rec,seen)).filter(Boolean);
    }catch(err){
      return [];
    }
  },
  save(){
    return storage.write(CUSTOM_KEY,customs);
  }
};

function newCustomId(){
  let unique=null;
  try{
    if(typeof crypto!=='undefined'&&crypto.randomUUID)unique=crypto.randomUUID();
  }catch(err){}
  if(!unique)unique=`${Date.now().toString(36)}-${customSeq.toString(36)}-${Math.random().toString(36).slice(2,10)}`;
  customSeq+=1;
  const id=`custom-${unique}`;
  if(switchesById.has(id)||customs.some(c=>c.id===id))return newCustomId();
  return id;
}

function haptic(style){
  if(!Haptics)return;
  try{
    Promise.resolve(Haptics.impact({style})).catch(()=>{});
  }catch(err){}
}

function renderSwitch(s){
  s.toggles.forEach(t=>{
    if(s.off)t.classList.add('off');
    else t.classList.remove('off');
    t.setAttribute('aria-label',`${s.off?'Turn on':'Turn off'} ${s.item.name}`);
  });
}

function renderFavorite(s){
  const favorited=favorites.includes(s.id);
  s.favButtons.forEach(b=>{
    b.textContent=favorited?'★':'☆';
    b.setAttribute('aria-pressed',String(favorited));
    b.setAttribute('aria-label',favorited?`Remove ${s.item.name} from favorites`:`Add ${s.item.name} to favorites`);
  });
}

function renderQuickAccess(){
  quickCard.replaceChildren(...favorites.map(id=>switchesById.get(id).quickRow));
  quickAccess.hidden=favorites.length===0;
  switches.forEach(renderFavorite);
}

function renderMine(){
  mineSection.hidden=customs.length===0;
}

function setOn(s){
  s.off=false;
  renderSwitch(s);
  clearTimeout(s.resetTimer);
  s.resetTimer=null;
}

function setOff(s,expiresAt){
  s.off=true;
  renderSwitch(s);
  clearTimeout(s.resetTimer);
  s.resetTimer=setTimeout(reconcile,Math.max(0,expiresAt-Date.now()));
}

function reconcile(){
  const now=Date.now();
  let changed=false;
  switches.forEach(s=>{
    const expiresAt=expirations[s.id];
    if(typeof expiresAt==='number'&&expiresAt>now){
      setOff(s,expiresAt);
      return;
    }
    if(s.id in expirations){
      delete expirations[s.id];
      changed=true;
    }
    setOn(s);
  });
  if(changed)store.save();
}

function pause(s,durationMs){
  const i=s.item;
  const expiresAt=Date.now()+durationMs;
  expirations[s.id]=expiresAt;
  store.save();
  setOff(s,expiresAt);
  haptic('MEDIUM');
  noticeIcon.textContent=i.icon;
  noticeTitle.textContent=i.name;
  noticeMessage.textContent=i.message;
  clearTimeout(noticeTimer);
  notice.classList.remove('show');
  requestAnimationFrame(()=>requestAnimationFrame(()=>notice.classList.add('show')));
  noticeTimer=setTimeout(()=>notice.classList.remove('show'),4500);
}

function layoutChooser(s){
  const def=s.item.defaultDurationMinutes;
  const ordered=DURATION_MINUTES.map(m=>chooserOptions.children.find(b=>b.minutes===m)).filter(Boolean);
  if(DURATION_MINUTES.includes(def)){
    const i=ordered.findIndex(b=>b.minutes===def);
    if(i>0)ordered.unshift(ordered.splice(i,1)[0]);
  }
  ordered.forEach(b=>{
    b.textContent=b.minutes===def?`${b.minutes} minutes · Default`:`${b.minutes} minutes`;
    chooserOptions.appendChild(b);
  });
}

function openChooser(s,returnFocus){
  if(creator.classList.contains('show')||deleter.classList.contains('show'))return;
  chooserFor=s;
  chooserReturnFocus=returnFocus;
  chooserTitle.textContent=`Pause ${s.item.name} for…`;
  layoutChooser(s);
  chooser.classList.add('show');
  chooser.setAttribute('aria-hidden','false');
  phone.inert=true;
  chooserOptions.children[0].focus({preventScroll:true});
}

function closeChooser(){
  const s=chooserFor;
  chooserFor=null;
  chooser.classList.remove('show');
  chooser.setAttribute('aria-hidden','true');
  phone.inert=false;
  if(chooserReturnFocus)chooserReturnFocus.focus({preventScroll:true});
  chooserReturnFocus=null;
  return s;
}

DURATION_MINUTES.forEach(minutes=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='chooser-option';
  b.minutes=minutes;
  b.textContent=`${minutes} minutes`;
  b.onclick=()=>{
    const s=closeChooser();
    if(s&&!s.off)pause(s,minutes*60000);
  };
  chooserOptions.appendChild(b);
});
chooserCancel.onclick=closeChooser;
chooserBackdrop.onclick=closeChooser;
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(chooserFor)closeChooser();
  else if(deleteFor)closeDeleter();
  else if(creator.classList.contains('show'))closeCreator();
  else if(shutdownSheet)closeShutdownSheet();
});

document.documentElement.classList.add('restoring');

function onToggleTap(s,toggle){
  if(!ready)return;

  if(s.off){
    delete expirations[s.id];
    store.save();
    setOn(s);
    haptic('LIGHT');

    if(noticeTitle.textContent===s.item.name){
      clearTimeout(noticeTimer);
      notice.classList.remove('show');
    }
    return;
  }

  openChooser(s,toggle);
}

function onFavoriteTap(s,button){
  if(!ready)return;
  const n=favorites.indexOf(s.id);
  if(n===-1)favorites.push(s.id);
  else favorites.splice(n,1);
  favoriteStore.save();
  renderQuickAccess();
  if(n!==-1&&button===s.favButtons[1])s.favButtons[0].focus({preventScroll:true});
}

function el(tag,className,text){
  const e=document.createElement(tag);
  if(className)e.className=className;
  if(text)e.textContent=text;
  return e;
}

function buildRow(s){
  const row=el('div','row');
  const name=el('div','name');
  name.appendChild(el('span','icon',s.item.icon));
  name.appendChild(el('span','',s.item.name));
  const controls=el('div','controls');
  const fav=el('button','fav');
  fav.type='button';
  fav.onclick=()=>onFavoriteTap(s,fav);
  const toggle=el('button','toggle');
  toggle.type='button';
  toggle.appendChild(el('span','knob'));
  toggle.onclick=()=>onToggleTap(s,toggle);
  if(s.custom){
    const del=el('button','remove','Delete');
    del.type='button';
    del.setAttribute('aria-label',`Delete ${s.item.name}`);
    del.onclick=()=>openDeleter(s,del);
    controls.appendChild(del);
    s.deleteButtons.push(del);
  }
  controls.appendChild(fav);
  controls.appendChild(toggle);
  row.appendChild(name);
  row.appendChild(controls);
  s.favButtons.push(fav);
  s.toggles.push(toggle);
  return row;
}

function attach(s){
  const row=buildRow(s);
  s.rows.push(row);
  document.getElementById(s.item.section).appendChild(row);
  s.quickRow=buildRow(s);
  s.rows.push(s.quickRow);
  renderSwitch(s);
  renderFavorite(s);
  return s;
}

function makeSwitch(item,custom){
  const s={id:item.id,item,custom:!!custom,off:false,toggles:[],favButtons:[],deleteButtons:[],rows:[],resetTimer:null,quickRow:null};
  switches.push(s);
  switchesById.set(s.id,s);
  return attach(s);
}

function labeledInput(className,label,tag,maxLength){
  const wrap=el('label','field');
  wrap.appendChild(el('span','field-label',label));
  const input=el(tag,className);
  input.maxLength=maxLength;
  input.setAttribute('maxlength',String(maxLength));
  input.setAttribute('aria-required','true');
  wrap.appendChild(input);
  creatorFields.appendChild(wrap);
  return input;
}

const nameInput=labeledInput('custom-name','Name','input',MAX_NAME);
const messageInput=labeledInput('custom-message','Supportive message','textarea',MAX_MESSAGE);
messageInput.removeAttribute('aria-required');
messageInput.setAttribute('aria-required','true');
const iconInput=labeledInput('custom-icon','Icon','input',16);
iconInput.removeAttribute('aria-required');
iconInput.setAttribute('aria-label','Icon, one emoji, optional');
const durationGroup=el('div','field');
durationGroup.setAttribute('role','radiogroup');
durationGroup.setAttribute('aria-label','Default pause');
durationGroup.appendChild(el('span','field-label','Default pause'));
const durationInputs=DURATION_MINUTES.map(minutes=>{
  const choice=el('label','duration-choice');
  const input=el('input','custom-duration');
  input.type='radio';
  input.name='defaultDuration';
  input.minutes=minutes;
  input.setAttribute('aria-label',`${minutes} minutes`);
  choice.appendChild(input);
  choice.appendChild(el('span','',`${minutes} minutes`));
  durationGroup.appendChild(choice);
  return input;
});
creatorFields.appendChild(durationGroup);

function resetCreator(){
  nameInput.value='';
  messageInput.value='';
  iconInput.value='';
  creatorError.textContent='';
  durationInputs.forEach(input=>{input.checked=input.minutes===2;});
}

function openCreator(){
  if(!ready||chooserFor||deleteFor)return;
  resetCreator();
  creator.classList.add('show');
  creator.setAttribute('aria-hidden','false');
  phone.inert=true;
  nameInput.focus({preventScroll:true});
}

function closeCreator(){
  creator.classList.remove('show');
  creator.setAttribute('aria-hidden','true');
  phone.inert=false;
  createSwitchButton.focus({preventScroll:true});
}

function saveCustom(e){
  if(e)e.preventDefault();
  if(!ready)return;
  const name=nameInput.value.trim();
  const message=messageInput.value.trim();
  if(!name||name.length>MAX_NAME){
    creatorError.textContent='Add a name.';
    nameInput.focus({preventScroll:true});
    return;
  }
  if(!message||message.length>MAX_MESSAGE){
    creatorError.textContent='Add a supportive message.';
    messageInput.focus({preventScroll:true});
    return;
  }
  const picked=durationInputs.find(input=>input.checked);
  const record={
    id:newCustomId(),
    name,
    message,
    icon:oneEmoji(iconInput.value),
    defaultDurationMinutes:picked?picked.minutes:2
  };
  customs.push(record);
  customStore.save();
  makeSwitch({...record,section:'mine'},true);
  renderMine();
  closeCreator();
}

function openDeleter(s,returnFocus){
  if(!ready||chooserFor||creator.classList.contains('show'))return;
  deleteFor=s;
  deleteReturnFocus=returnFocus;
  deleterTitle.textContent=`Delete ${s.item.name}?`;
  deleter.classList.add('show');
  deleter.setAttribute('aria-hidden','false');
  phone.inert=true;
  deleterSheet.focus({preventScroll:true});
}

function closeDeleter(){
  deleteFor=null;
  deleter.classList.remove('show');
  deleter.setAttribute('aria-hidden','true');
  phone.inert=false;
  if(deleteReturnFocus)deleteReturnFocus.focus({preventScroll:true});
  deleteReturnFocus=null;
}

function confirmDelete(){
  const s=deleteFor;
  if(!s)return;
  deleteFor=null;
  deleter.classList.remove('show');
  deleter.setAttribute('aria-hidden','true');
  phone.inert=false;
  deleteReturnFocus=null;
  customs=customs.filter(c=>c.id!==s.id);
  customStore.save();
  const n=favorites.indexOf(s.id);
  if(n!==-1){
    favorites.splice(n,1);
    favoriteStore.save();
  }
  if(s.id in expirations){
    delete expirations[s.id];
    store.save();
  }
  clearTimeout(s.resetTimer);
  s.rows.forEach(row=>row.remove());
  const index=switches.indexOf(s);
  if(index!==-1)switches.splice(index,1);
  switchesById.delete(s.id);
  if(noticeTitle.textContent===s.item.name){
    clearTimeout(noticeTimer);
    notice.classList.remove('show');
  }
  renderQuickAccess();
  renderMine();
  createSwitchButton.focus({preventScroll:true});
}

createSwitchButton.onclick=openCreator;
creatorForm.onsubmit=saveCustom;
creatorCancel.onclick=closeCreator;
creatorBackdrop.onclick=closeCreator;
deleterConfirm.onclick=confirmDelete;
deleterCancel.onclick=closeDeleter;
deleterBackdrop.onclick=closeDeleter;

const SHUTDOWN_KEY='toggle.shutdown.v1';
const SHUTDOWN_MINUTES=[10,20,30,60];
const SHUTDOWN_SOUNDS=[
  {id:'brown-noise',name:'Brown Noise'},
  {id:'rain',name:'Rain'},
  {id:'ocean',name:'Ocean'},
  {id:'quiet',name:'Quiet'}
];
const SHUTDOWN_TRANSITIONS=[
  {id:'immersive',name:'Immersive'},
  {id:'gentle',name:'Gentle'},
  {id:'minimal',name:'Minimal'}
];
const SHUTDOWN_FACTORY={durationMinutes:20,sound:'brown-noise',transition:'immersive'};
const shutdownView=document.getElementById('shutdownView');
const shutdownRemaining=document.getElementById('shutdownRemaining');
const shutdownSoundName=document.getElementById('shutdownSoundName');
const shutdownEntry=document.getElementById('shutdownEntry');
let shutdownState={defaults:{...SHUTDOWN_FACTORY},session:null};
let shutdownTimer=null;
let shutdownSheet=null;

function shutdownName(list,id){
  const found=list.find(item=>item.id===id);
  return found?found.name:null;
}

function validShutdownChoice(value,list,fallback){
  return list.some(item=>item.id===value)?value:fallback;
}

function validShutdownDefaults(value){
  const source=value&&typeof value==='object'?value:{};
  const duration=SHUTDOWN_MINUTES.includes(source.durationMinutes)?source.durationMinutes:SHUTDOWN_FACTORY.durationMinutes;
  return {
    durationMinutes:duration,
    sound:validShutdownChoice(source.sound,SHUTDOWN_SOUNDS,SHUTDOWN_FACTORY.sound),
    transition:validShutdownChoice(source.transition,SHUTDOWN_TRANSITIONS,SHUTDOWN_FACTORY.transition)
  };
}

function validShutdownSession(value){
  if(!value||typeof value!=='object'||typeof value.endsAt!=='number'||!Number.isFinite(value.endsAt))return null;
  const defaults=validShutdownDefaults(value);
  return {...defaults,endsAt:value.endsAt};
}

const shutdownStore={
  async load(){
    try{
      const parsed=await storage.read(SHUTDOWN_KEY);
      if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))return {defaults:{...SHUTDOWN_FACTORY},session:null};
      return {defaults:validShutdownDefaults(parsed.defaults),session:validShutdownSession(parsed.session)};
    }catch(err){
      return {defaults:{...SHUTDOWN_FACTORY},session:null};
    }
  },
  save(){
    return storage.write(SHUTDOWN_KEY,{defaults:shutdownState.defaults,session:shutdownState.session});
  }
};

function formatRemaining(ms){
  const total=Math.max(0,Math.ceil(ms/1000));
  const minutes=Math.floor(total/60);
  const seconds=total%60;
  return `${minutes}:${String(seconds).padStart(2,'0')}`;
}

function renderShutdown(){
  const session=shutdownState.session;
  if(!session)return;
  const remaining=session.endsAt-Date.now();
  shutdownRemaining.textContent=formatRemaining(remaining);
  shutdownRemaining.setAttribute('aria-label',`${formatRemaining(remaining)} remaining`);
  const sound=shutdownName(SHUTDOWN_SOUNDS,session.sound);
  const transition=shutdownName(SHUTDOWN_TRANSITIONS,session.transition);
  shutdownSoundName.textContent=sound;
  document.getElementById('shutdownSoundButton').textContent=`Sound · ${sound}`;
  document.getElementById('shutdownTimeButton').textContent=`Time · ${session.durationMinutes} minutes`;
  document.getElementById('shutdownTransitionButton').textContent=`Transition · ${transition}`;
}

function showShutdown(){
  shutdownView.hidden=false;
  shutdownView.setAttribute('aria-hidden','false');
  phone.hidden=true;
  phone.setAttribute('aria-hidden','true');
  renderShutdown();
}

function showMain(){
  shutdownView.hidden=true;
  shutdownView.setAttribute('aria-hidden','true');
  phone.hidden=false;
  phone.removeAttribute('aria-hidden');
}

function scheduleShutdownTick(){
  clearTimeout(shutdownTimer);
  shutdownTimer=null;
  if(!shutdownState.session)return;
  const remaining=shutdownState.session.endsAt-Date.now();
  if(remaining<=0){
    endShutdown(false);
    return;
  }
  shutdownTimer=setTimeout(()=>{
    if(!shutdownState.session)return;
    if(shutdownState.session.endsAt<=Date.now())endShutdown(false);
    else{
      renderShutdown();
      scheduleShutdownTick();
    }
  },Math.min(1000,remaining));
}

function closeShutdownSheet(){
  if(!shutdownSheet)return;
  shutdownSheet.classList.remove('show');
  shutdownSheet.setAttribute('aria-hidden','true');
  shutdownSheet=null;
}

function openShutdownSheet(sheet){
  if(!shutdownState.session)return;
  closeShutdownSheet();
  shutdownSheet=sheet;
  sheet.classList.add('show');
  sheet.setAttribute('aria-hidden','false');
  const first=sheet.querySelector('button');
  if(first)first.focus({preventScroll:true});
}

function beginShutdown(){
  if(!ready||shutdownState.session)return;
  const defaults=shutdownState.defaults;
  shutdownState.session={
    endsAt:Date.now()+defaults.durationMinutes*60000,
    durationMinutes:defaults.durationMinutes,
    sound:defaults.sound,
    transition:defaults.transition
  };
  shutdownStore.save();
  showShutdown();
  scheduleShutdownTick();
}

// Changing the duration restarts from now. The session ends at the moment of the change plus the newly chosen length.
function setShutdownDuration(minutes){
  if(!shutdownState.session||!SHUTDOWN_MINUTES.includes(minutes))return;
  shutdownState.session.endsAt=Date.now()+minutes*60000;
  shutdownState.session.durationMinutes=minutes;
  shutdownState.defaults.durationMinutes=minutes;
  shutdownStore.save();
  closeShutdownSheet();
  renderShutdown();
  scheduleShutdownTick();
}

function setShutdownSound(id){
  if(!shutdownState.session||!shutdownName(SHUTDOWN_SOUNDS,id))return;
  shutdownState.session.sound=id;
  shutdownState.defaults.sound=id;
  shutdownStore.save();
  closeShutdownSheet();
  renderShutdown();
}

function setShutdownTransition(id){
  if(!shutdownState.session||!shutdownName(SHUTDOWN_TRANSITIONS,id))return;
  shutdownState.session.transition=id;
  shutdownState.defaults.transition=id;
  shutdownStore.save();
  closeShutdownSheet();
  renderShutdown();
}

function endShutdown(manual){
  closeShutdownSheet();
  clearTimeout(shutdownTimer);
  shutdownTimer=null;
  shutdownState.session=null;
  shutdownStore.save();
  showMain();
  if(manual)haptic('LIGHT');
}

function reconcileShutdown(){
  const session=shutdownState.session;
  if(!session){
    showMain();
    return;
  }
  if(session.endsAt<=Date.now()){
    endShutdown(false);
    return;
  }
  showShutdown();
  scheduleShutdownTick();
}

function fillShutdownOptions(container,items,current,onPick){
  items.forEach(item=>{
    const button=el('button','chooser-option',item.label);
    button.type='button';
    button.setAttribute('aria-pressed',String(item.id===current));
    button.onclick=()=>onPick(item.id);
    container.appendChild(button);
  });
}

function refillShutdownSheet(container,items,current,onPick){
  container.replaceChildren();
  fillShutdownOptions(container,items,current,onPick);
}

shutdownEntry.onclick=beginShutdown;
document.getElementById('shutdownEnd').onclick=()=>endShutdown(true);
document.getElementById('shutdownTimeButton').onclick=()=>{
  refillShutdownSheet(
    document.getElementById('shutdownTimeOptions'),
    SHUTDOWN_MINUTES.map(minutes=>({id:minutes,label:`${minutes} minutes`})),
    shutdownState.session&&shutdownState.session.durationMinutes,
    setShutdownDuration
  );
  openShutdownSheet(document.getElementById('shutdownTimeSheet'));
};
document.getElementById('shutdownSoundButton').onclick=()=>{
  refillShutdownSheet(
    document.getElementById('shutdownSoundOptions'),
    SHUTDOWN_SOUNDS.map(sound=>({id:sound.id,label:sound.name})),
    shutdownState.session&&shutdownState.session.sound,
    setShutdownSound
  );
  openShutdownSheet(document.getElementById('shutdownSoundSheet'));
};
document.getElementById('shutdownTransitionButton').onclick=()=>{
  refillShutdownSheet(
    document.getElementById('shutdownTransitionOptions'),
    SHUTDOWN_TRANSITIONS.map(style=>({id:style.id,label:style.name})),
    shutdownState.session&&shutdownState.session.transition,
    setShutdownTransition
  );
  openShutdownSheet(document.getElementById('shutdownTransitionSheet'));
};
['shutdownTimeCancel','shutdownSoundCancel','shutdownTransitionCancel','shutdownTimeBackdrop','shutdownSoundBackdrop','shutdownTransitionBackdrop'].forEach(id=>{
  document.getElementById(id).onclick=closeShutdownSheet;
});

items.forEach(i=>makeSwitch(i,false));

Promise.all([store.load(),customStore.load(),shutdownStore.load()]).then(([saved,savedCustoms,savedShutdown])=>{
  customs=savedCustoms;
  customs.forEach(rec=>makeSwitch({...rec,section:'mine'},true));
  renderMine();
  shutdownState=savedShutdown;
  return favoriteStore.load().then(savedFavorites=>{
    expirations=saved;
    favorites=savedFavorites;
    reconcile();
    renderQuickAccess();
    reconcileShutdown();
    ready=true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('restoring')));
  });
});

function onForeground(){
  if(!ready)return;
  reconcile();
  reconcileShutdown();
}
if(App)App.addListener('appStateChange',state=>{if(state.isActive)onForeground();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')onForeground();});
</script></body></html>
