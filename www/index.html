<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>Mel's Mind</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<style>
:root{
  color-scheme:light dark;
  --page-bg:#111111;
  --phone-bg:#000000;
  --text:#ffffff;
  --secondary:#98989f;
  --card:#1c1c1e;
  --divider:#38383a;
  --toggle-off:#636366;
  --banner-bg:rgba(44,44,46,.78);
  --banner-border:rgba(255,255,255,.18);
  --banner-highlight:rgba(255,255,255,.20);
  --banner-shadow:rgba(0,0,0,.42);
  --banner-app:#f2f2f7;
  --banner-title:#ffffff;
  --banner-message:#d1d1d6;
}
body{margin:0;background:var(--page-bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;display:flex;justify-content:center;padding:30px}
.phone{width:390px;min-height:800px;background:var(--phone-bg);border-radius:45px;padding:21px;box-sizing:border-box;box-shadow:0 0 40px rgba(0,0,0,.78)}
h1{font-size:32px;line-height:1.12;margin:5px 0}.sub{color:var(--secondary);font-size:15px;margin-bottom:22px}
.section{color:var(--secondary);font-size:12px;text-transform:uppercase;letter-spacing:.02em;margin:20px 8px 7px}
.card{background:var(--card);border-radius:15px;overflow:hidden}
.row{height:57px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--divider)}
.row:last-child{border:0}.name{display:flex;align-items:center;gap:11px;font-size:16px}.icon{width:24px;text-align:center;font-size:20px;line-height:1}
.toggle{width:49px;height:29px;border-radius:18px;background:#34c759;position:relative;border:0;padding:0;cursor:pointer;transition:background-color .18s ease}.toggle.off{background:var(--toggle-off)}.knob{width:25px;height:25px;background:#fff;border-radius:50%;position:absolute;top:2px;right:2px;box-shadow:0 1px 3px rgba(0,0,0,.42);transition:transform .18s ease}.toggle.off .knob{right:2px;transform:translateX(-20px)}
.notice{position:fixed;z-index:20;top:18px;left:50%;width:min(340px,calc(100vw - 28px));box-sizing:border-box;display:grid;grid-template-columns:38px minmax(0,1fr);gap:11px;align-items:start;padding:13px 13px 14px;border:1px solid var(--banner-border);border-radius:19px;background:var(--banner-bg);box-shadow:inset 0 1px 0 var(--banner-highlight),0 12px 34px var(--banner-shadow);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%);opacity:0;pointer-events:none;transform:translate(-50%,-130%);transition:transform .36s cubic-bezier(.2,.9,.25,1.18),opacity .24s ease}
.notice.show{opacity:1;transform:translate(-50%,0)}
.notice-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:20px;line-height:1;background:#5856d6}
.notice-copy{min-width:0}.notice-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}.notice-app{font-size:12px;font-weight:600;color:var(--banner-app)}.notice-time{font-size:11px;color:var(--secondary)}.notice-title{font-size:14px;line-height:1.2;font-weight:600;color:var(--banner-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice-message{margin-top:4px;font-size:13px;line-height:1.3;color:var(--banner-message)}
@media(prefers-color-scheme:light){
  :root{
    --page-bg:#e5e5ea;
    --phone-bg:#f2f2f7;
    --text:#000000;
    --secondary:#6e6e73;
    --card:#ffffff;
    --divider:rgba(60,60,67,.18);
    --toggle-off:#e5e5ea;
    --banner-bg:rgba(248,248,250,.76);
    --banner-border:rgba(255,255,255,.82);
    --banner-highlight:rgba(255,255,255,.92);
    --banner-shadow:rgba(0,0,0,.18);
    --banner-app:#3c3c43;
    --banner-title:#000000;
    --banner-message:#3c3c43;
  }
  .phone{box-shadow:0 0 40px rgba(0,0,0,.18)}
}
@media(max-width:520px){body{background:var(--phone-bg);padding:0}.phone{width:100%;min-height:100vh;border-radius:0;padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));box-shadow:none}.notice{top:calc(10px + env(safe-area-inset-top))}}
</style></head>
<body><div class="phone">
<h1>Mel's Mind</h1><div class="sub">Your brain. Your settings.</div>
<div id="notice" class="notice" role="status" aria-live="polite">
  <div id="noticeIcon" class="notice-icon">🧠</div>
  <div class="notice-copy">
    <div class="notice-meta"><span class="notice-app">Mel's Mind</span><span class="notice-time">now</span></div>
    <div id="noticeTitle" class="notice-title">Overthinking</div>
    <div id="noticeMessage" class="notice-message">You don't need to solve this right now.</div>
  </div>
</div>
<div class="section">Mind Alerts</div><div class="card" id="mind"></div>
<div class="section">Boundaries</div><div class="card" id="bounds"></div>
</div>
<script>
const items=[
['🧠','Overthinking','You don\'t need to solve this right now.','mind'],
['🌀','Spiraling','Pause. Take one deep breath.','mind'],
['💭','Assuming','You don\'t have all the pieces yet.','mind'],
['🔁','Replaying It','Let it rest.','mind'],
['🪞','Self-Criticism','Talk to yourself like someone you love.','mind'],
['🌧️','Thinking Worst Case','You don\'t know the future yet.','mind'],
['🐇','Rabbit Hole','Come back to where you are.','mind'],
['🔍','Need to Know','Not everything needs to be solved in this moment.','mind'],
['🔕','Mental Noise','Where could you find some quiet right now?','mind'],
['🔐','Access','Access to you is not unlimited.','bounds'],
['🛟','Savior Mode','You can care without carrying it.','bounds'],
['⚖️','Feeling Obligated','A request is not a requirement.','bounds']
];
const notice=document.getElementById('notice');
const noticeIcon=document.getElementById('noticeIcon');
const noticeTitle=document.getElementById('noticeTitle');
const noticeMessage=document.getElementById('noticeMessage');
let noticeTimer;
items.forEach(i=>{
  let r=document.createElement('div');
  r.className='row';
  r.innerHTML=`<div class=name><span class=icon>${i[0]}</span>${i[1]}</div><button class=toggle aria-label="Turn off ${i[1]}"><span class=knob></span></button>`;
  r.querySelector('button').onclick=e=>{
    const toggle=e.currentTarget;

    if(toggle.classList.contains('off')){
      toggle.classList.remove('off');
      toggle.setAttribute('aria-label',`Turn off ${i[1]}`);
      clearTimeout(toggle.resetTimer);
      toggle.resetTimer=null;

      if(noticeTitle.textContent===i[1]){
        clearTimeout(noticeTimer);
        notice.classList.remove('show');
      }
      return;
    }

    toggle.classList.add('off');
    toggle.setAttribute('aria-label',`Turn on ${i[1]}`);
    noticeIcon.textContent=i[0];
    noticeTitle.textContent=i[1];
    noticeMessage.textContent=i[2];
    clearTimeout(noticeTimer);
    notice.classList.remove('show');
    requestAnimationFrame(()=>requestAnimationFrame(()=>notice.classList.add('show')));
    noticeTimer=setTimeout(()=>notice.classList.remove('show'),4500);

    clearTimeout(toggle.resetTimer);
    toggle.resetTimer=setTimeout(()=>{
      toggle.classList.remove('off');
      toggle.setAttribute('aria-label',`Turn off ${i[1]}`);
      toggle.resetTimer=null;
    },120000);
  };
  document.getElementById(i[3]).appendChild(r);
});
</script></body></html>
